<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<script src="./etternum-data.js"></script>
<script src="./image-slot.js"></script>
<style>
html,body{margin:0;height:100%;background:#0B0B0C;font-family:Urbanist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#E0C78E;text-decoration:none}a:hover{color:#EBD6A6}
button{font-family:inherit}
input,textarea{font-family:inherit}
::selection{background:rgba(224,199,142,.35)}
@keyframes etPulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@keyframes etShimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes etBlink{0%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes etSpin{to{transform:rotate(360deg)}}
@keyframes etIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes etPop{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes etGlow{0%,100%{box-shadow:0 0 40px rgba(224,199,142,.25)}50%{box-shadow:0 0 80px rgba(224,199,142,.5)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</helmet>
<div ref="{{ rootRef }}" style="position:relative;transform:translateZ(0);height:{{ rootH }};overflow:hidden;background:{{ t.bg }};color:{{ t.ink }};font-family:Urbanist,system-ui,sans-serif;transition:background .3s,color .3s">
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">

<sc-if value="{{ isPublic }}" hint-placeholder-val="{{ false }}">
<div ref="{{ scrollRef }}" style="height:100%;overflow-y:auto"><dc-import name="Publico" app="{{ app }}" hint-size="100%,100%"></dc-import></div>
</sc-if>

<sc-if value="{{ isTriagem }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;overflow-y:auto"><dc-import name="Triagem" app="{{ app }}" hint-size="100%,100%"></dc-import></div>
</sc-if>

<sc-if value="{{ isAdminR }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;overflow-y:auto"><dc-import name="Clube" mode="admin" hint-size="100%,100%"></dc-import></div>
</sc-if>

<sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;display:flex;flex-direction:{{ shellDir }};gap:{{ shellGap }};padding:{{ shellPad }}">

<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<aside style="flex:none;width:236px;height:100%;border-radius:26px;background:{{ t.panel }};box-shadow:inset 0 0 0 1px {{ t.line }};padding:26px 14px 16px;display:flex;flex-direction:column;gap:26px;overflow-y:auto;scrollbar-width:none">
<button onClick="{{ goInicio }}" style="flex:none;display:flex;align-items:center;gap:9px;padding:0 10px;border:0;background:transparent;color:{{ t.ink }};cursor:pointer"><et-i n="infinity" s="26" c="#E0C78E"></et-i><span style="font:800 16px Urbanist;letter-spacing:.22em">ETTERNUM</span></button>
<nav style="flex:none;display:flex;flex-direction:column;gap:3px">
<sc-for list="{{ sideItems }}" as="n" hint-placeholder-count="7"><button key="{{ n.k }}" onClick="{{ n.go }}" style="flex:none;height:42px;padding:0 14px;border-radius:999px;border:0;display:flex;align-items:center;gap:12px;font:600 14.5px Urbanist;background:{{ n.bg }};color:{{ n.fg }};cursor:pointer;text-align:left"><et-i n="{{ n.icon }}" s="18"></et-i>{{ n.label }}</button></sc-for>
</nav>
<button onClick="{{ goMaestro }}" style="flex:none;height:44px;border-radius:999px;border:0;background:{{ t.altBg }};color:{{ t.altFg }};font:700 14px Urbanist;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s" style-active="transform:scale(.97)"><et-i n="infinity" s="16"></et-i>Falar com o Maestro</button>
<div style="flex:1"></div>
<button onClick="{{ goSair }}" style="flex:none;height:40px;padding:0 14px;border:0;background:transparent;display:flex;align-items:center;gap:12px;font:600 14.5px Urbanist;color:{{ t.muted }};cursor:pointer"><et-i n="log-out" s="18"></et-i>Sair</button>
</aside>
</sc-if>

<div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column">
<header style="flex:none;height:{{ topH }};display:flex;align-items:center;gap:12px;padding:{{ topPad }};background:{{ topBg }};border-bottom:{{ topBorder }}">
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<span style="flex:1 0 auto;font:700 22px Urbanist;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Olá, <span style="font-family:'EB Garamond',serif;font-style:italic;font-weight:400;color:{{ t.accentText }}">Ana</span></span>
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><button onClick="{{ goMentes }}" style="width:260px;height:42px;border-radius:999px;border:0;background:{{ t.card }};box-shadow:inset 0 0 0 1px {{ t.line }};display:flex;align-items:center;gap:10px;padding:0 16px;color:{{ t.faint }};font:500 14px Urbanist;cursor:pointer;white-space:nowrap"><et-i n="search" s="16"></et-i>Mente, tema, área</button></sc-if>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ goInicio }}" aria-label="Início" style="width:44px;height:44px;margin-left:-10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer"><et-i n="infinity" s="28" c="#E0C78E"></et-i></button>
<span style="flex:1"></span>
</sc-if>
<button onClick="{{ goPlano }}" style="height:32px;padding:0 13px;border-radius:999px;border:0;background:{{ t.pillBg }};color:{{ t.pillFg }};font:700 12.5px Urbanist;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:{{ t.pillFg }}"></span>{{ planLabel }}</button>
<sc-if value="{{ showUpgrade }}" hint-placeholder-val="{{ true }}"><button onClick="{{ goPlano }}" style="height:40px;padding:0 18px;border-radius:999px;border:0;background:{{ t.accent }};color:{{ t.onAccent }};font:700 14px Urbanist;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;transition:background .2s"><et-i n="sparkles" s="15"></et-i>Fazer upgrade</button></sc-if>
<button onClick="{{ toggleTheme }}" aria-label="Alternar tema" style="width:44px;height:44px;border-radius:50%;border:0;background:{{ t.card }};box-shadow:inset 0 0 0 1px {{ t.line }};color:{{ t.ink }};display:grid;place-items:center;cursor:pointer;transition:transform .3s" style-hover="transform:rotate(20deg)"><et-i n="{{ t.themeIcon }}" s="18"></et-i></button>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ goPerfil }}" style="display:flex;align-items:center;gap:10px;border:0;background:transparent;color:{{ t.ink }};cursor:pointer;padding:0 0 0 6px;text-align:left"><span style="width:40px;height:40px;border-radius:50%;background:{{ t.pastel1 }};color:#15130E;display:grid;place-items:center;font:700 15px Urbanist">AC</span><span style="display:{{ nameDisplay }};flex-direction:column;white-space:nowrap"><span style="font:700 14px Urbanist">Ana Clara</span><span style="font:500 12px Urbanist;color:{{ t.muted }}">♐︎ Sagitário</span></span></button>
</sc-if>
</header>

<div ref="{{ scrollRef }}" style="position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:{{ contentPad }}">
<sc-if value="{{ r.chat }}" hint-placeholder-val="{{ false }}"><div key="{{ routeKey }}" style="position:absolute;inset:0"><dc-import name="Chat" app="{{ app }}" hint-size="100%,100%"></dc-import></div></sc-if>
<sc-if value="{{ notChat }}" hint-placeholder-val="{{ true }}"><div key="{{ routeKey }}" style="animation:etIn .45s cubic-bezier(.25,.1,.25,1) both;min-height:100%">
<sc-if value="{{ r.inicio }}" hint-placeholder-val="{{ false }}"><dc-import name="Inicio" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{ r.explorar }}" hint-placeholder-val="{{ false }}"><dc-import name="Explorar" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{ r.conselho }}" hint-placeholder-val="{{ false }}"><dc-import name="Conselho" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{ r.conta }}" hint-placeholder-val="{{ false }}"><dc-import name="Conta" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{ r.clube }}" hint-placeholder-val="{{ false }}"><dc-import name="Clube" embedded="{{ true }}" mode="leitor" hint-size="100%,900px"></dc-import></sc-if>
</div></sc-if>
</div>

<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<nav style="flex:none;padding:6px 6px 26px;display:grid;grid-template-columns:repeat(5,1fr);background:{{ t.glass }};backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid {{ t.line }}">
<sc-for list="{{ bottomItems }}" as="b" hint-placeholder-count="5"><button key="{{ b.k }}" onClick="{{ b.go }}" style="height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ b.fg }};font:600 11px Urbanist"><span style="height:30px;min-width:52px;border-radius:999px;background:{{ b.bg }};display:grid;place-items:center;transition:background .2s"><et-i n="{{ b.icon }}" s="21"></et-i></span>{{ b.label }}</button></sc-for>
</nav>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position:absolute;left:50%;bottom:{{ toastBottom }};transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;padding:13px 20px;border-radius:999px;background:{{ t.altBg }};color:{{ t.altFg }};font:600 14px Urbanist;box-shadow:0 20px 40px -12px rgba(0,0,0,.6);animation:etPop .35s cubic-bezier(.25,.1,.25,1) both;white-space:nowrap;max-width:92%"><et-i n="circle-check" s="17"></et-i>{{ toast }}</div>
</sc-if>

<sc-if value="{{ showMap }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:14px;bottom:{{ mapBottom }};z-index:70;display:flex;flex-direction:column;align-items:flex-start;gap:8px">
<sc-if value="{{ mapOpen }}" hint-placeholder-val="{{ false }}">
<div style="width:250px;max-height:420px;overflow-y:auto;padding:10px;border-radius:20px;background:#1F1F22;box-shadow:0 30px 60px -20px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ mapItems }}" as="m" hint-placeholder-count="12"><button onClick="{{ m.go }}" style="height:36px;padding:0 10px;border:0;border-radius:10px;background:{{ m.bg }};color:#F3EFE6;font:500 13px Urbanist;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:8px" style-hover="background:#2A2A2E"><span>{{ m.label }}</span><span style="color:#8A847A;font:11px ui-monospace,Menlo,monospace">{{ m.path }}</span></button></sc-for>
</div>
</sc-if>
<button onClick="{{ toggleMap }}" style="height:36px;padding:0 14px;border-radius:999px;border:0;background:#1F1F22;color:#E0C78E;box-shadow:inset 0 0 0 1px rgba(224,199,142,.35);font:700 12px Urbanist;display:flex;align-items:center;gap:6px;cursor:pointer"><et-i n="map" s="14"></et-i>Mapa de telas</button>
</div>
</sc-if>

</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;landing&quot;,&quot;cadastro&quot;,&quot;entrar&quot;,&quot;triagem&quot;,&quot;inicio&quot;,&quot;maestro&quot;,&quot;areas&quot;,&quot;area:negocios&quot;,&quot;area:astrologia&quot;,&quot;mentes&quot;,&quot;mente:frankl&quot;,&quot;mente:mate&quot;,&quot;conselho:negocios&quot;,&quot;clube&quot;,&quot;admin&quot;,&quot;conversas&quot;,&quot;perfil&quot;,&quot;plano&quot;,&quot;termos&quot;,&quot;estados&quot;,&quot;memoria&quot;,&quot;404&quot;],&quot;default&quot;:&quot;landing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;plan&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;trial&quot;,&quot;free&quot;,&quot;premium&quot;],&quot;default&quot;:&quot;trial&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;frameless&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;param&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
const ROUTES = [
  ['landing', 'Landing', '/'], ['cadastro', 'Cadastro', '/cadastro'], ['entrar', 'Entrar', '/entrar'], ['triagem', 'Triagem', '/triagem'],
  ['inicio', 'Início', '/inicio'], ['maestro', 'Maestro', '/maestro'], ['areas', 'Áreas da vida', '/areas'], ['area:negocios', 'Área · Negócios', '/area/negocios'],
  ['area:astrologia', 'Área · Astrologia', '/area/astrologia'], ['mentes', 'Todas as mentes', '/mentes'], ['clube', 'Clube do Livro', '/clube'], ['admin', 'Admin · Login', '/admin'], ['mente:frankl', 'Conversa · Frankl', '/mente/frankl'],
  ['mente:mate', 'Conversa · Gabor Maté', '/mente/mate'], ['conselho:negocios', 'Conselho', '/conselho/negocios'], ['conversas', 'Minhas conversas', '/conversas'],
  ['perfil', 'Perfil', '/perfil'], ['plano', 'Plano', '/plano'], ['termos', 'Termos', '/termos'], ['privacidade', 'Privacidade', '/privacidade'],
  ['estados', 'Estados globais', '/estados'], ['memoria', 'Memória Viva', '/memoria-viva'], ['404', '404', '/qualquer'],
];
const TITLES = { inicio: 'Início', maestro: 'Maestro', mente: 'Conversa', areas: 'Áreas da vida', area: 'Área', mentes: 'Todas as mentes', conselho: 'Conselho', clube: 'Clube do Livro', conversas: 'Minhas conversas', perfil: 'Perfil', plano: 'Plano', memoria: 'Em breve', estados: 'Estados globais' };
const PUBLIC = ['landing', 'cadastro', 'entrar', 'termos', 'privacidade', '404'];

class Component extends DCLogic {
  rootRef = el => { if (el && el !== this._rootEl) { this._rootEl = el; this.ro && this.ro.disconnect(); if (window.ResizeObserver) { this.ro = new ResizeObserver(e => { const w = Math.round(e[0].contentRect.width); if (w && w !== this.state.w) this.setState({ w }); }); this.ro.observe(el); } const w0 = Math.round(el.getBoundingClientRect().width); if (w0 && w0 !== this.state.w) setTimeout(() => this.setState({ w: w0 }), 0); } };
  scrollRef = React.createRef();
  constructor(p) {
    super(p);
    const sp = (p.screen || 'landing').split(':');
    this.state = { route: sp[0], param: p.param || sp[1] || '', theme: p.theme || 'dark', plan: p.plan || 'trial', favs: { frankl: true, seneca: true, jung: true }, toast: '', w: 1440, mapOpen: false, ready: !!window.ETT, nonce: 0, variant: p.variant || '' };
  }
  componentDidMount() {
    if (!window.ETT) this.poll = setInterval(() => { if (window.ETT) { clearInterval(this.poll); this.setState({ ready: true }); } }, 50);
  }
  componentDidUpdate(pp) {
    const p = this.props;
    if (pp.theme !== p.theme && p.theme) this.setState({ theme: p.theme });
    if (pp.plan !== p.plan && p.plan) this.setState({ plan: p.plan });
    if (pp.screen !== p.screen && p.screen) { const sp = p.screen.split(':'); this.setState({ route: sp[0], param: p.param || sp[1] || '' }); }
  }
  componentWillUnmount() { clearInterval(this.poll); clearTimeout(this.tt); this.ro && this.ro.disconnect(); }
  nav = (route, param, variant) => {
    this.setState(s => ({ route, param: param || '', variant: variant || '', nonce: s.nonce + 1, mapOpen: false }));
    requestAnimationFrame(() => { if (this.scrollRef.current) this.scrollRef.current.scrollTop = 0; });
  };
  toast = msg => { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2600); };
  renderVals() {
    const s = this.state, P = this.props;
    if (!s.ready || !window.ETT) return { ready: false, t: { bg: '#0B0B0C', ink: '#F3EFE6' }, rootH: P.frameless ? '100%' : '100vh', rootRef: this.rootRef };
    const E = window.ETT, t = { ...E.themes[s.theme], pastel1: E.themes[s.theme].pastel[0] };
    const mobile = P.device === 'mobile' || (P.device !== 'desktop' && s.w < 768);
    const desktop = !mobile;
    const route = s.route;
    const isPublic = PUBLIC.includes(route) || !['admin', 'triagem', 'inicio', 'maestro', 'mente', 'areas', 'area', 'mentes', 'conselho', 'clube', 'conversas', 'perfil', 'plano', 'memoria', 'estados'].includes(route);
    const isTriagem = route === 'triagem', isAdminR = route === 'admin';
    const app = {
      t, mobile, w: s.w, route: isPublic && !PUBLIC.includes(route) ? '404' : route, param: s.param, variant: s.variant || P.variant || '', plan: s.plan, favs: s.favs, nonce: s.nonce,
      nav: this.nav, toast: this.toast,
      setPlan: plan => this.setState({ plan }),
      toggleFav: slug => { const on = !s.favs[slug]; this.setState(st => ({ favs: { ...st.favs, [slug]: on } })); const m = E.bySlug[slug]; if (m) this.toast(on ? `${m.name} entrou no seu Quadro Eterno.` : `${m.name} saiu do seu Quadro Eterno.`); },
      toggleTheme: () => this.setState({ theme: s.theme === 'dark' ? 'light' : 'dark' }),
    };
    const active = { inicio: 0, maestro: 1, areas: 2, area: 2, conselho: 2, mentes: 3, mente: 3, clube: 4, conversas: 5, perfil: 6, plano: 7 }[route];
    const side = [['Início', 'house', 'inicio'], ['Maestro', 'infinity', 'maestro'], ['Áreas da vida', 'layout-grid', 'areas'], ['Todas as mentes', 'users', 'mentes'], ['Clube do Livro', 'library', 'clube'], ['Minhas conversas', 'messages-square', 'conversas'], ['Perfil', 'user-round', 'perfil'], ['Plano', 'crown', 'plano']];
    const bottom = [['Início', 'house', 'inicio', 0], ['Maestro', 'infinity', 'maestro', 1], ['Áreas', 'layout-grid', 'areas', 2], ['Clube', 'library', 'clube', 4], ['Perfil', 'user-round', 'perfil', 6]];
    const mobActive = active === 3 ? 2 : active === 5 || active === 7 ? 6 : active;
    const isChat = route === 'maestro' || route === 'mente';
    return {
      ready: true, t, app, wide: s.w >= 1180, nameDisplay: s.w >= 1180 ? 'flex' : 'none', rootRef: this.rootRef, scrollRef: this.scrollRef, rootH: P.frameless ? '100%' : '100vh',
      isPublic, isTriagem, isAdminR, isApp: !isPublic && !isTriagem && !isAdminR, desktop, mobile,
      shellDir: desktop ? 'row' : 'column', shellGap: desktop ? '14px' : '0px', shellPad: desktop ? '14px' : '0px',
      topH: desktop ? '64px' : '60px', topPad: desktop ? '0 4px 0 12px' : '0 16px', topBg: desktop ? 'transparent' : t.glass, topBorder: desktop ? '0' : `1px solid ${t.line}`,
      contentPad: isChat ? '0' : desktop ? '8px 4px 40px 12px' : '16px 16px 32px',
      pageTitle: TITLES[route] || '',
      planLabel: { trial: 'Teste grátis · 14 dias', free: 'Gratuito', premium: 'Premium' }[s.plan], showUpgrade: s.plan !== 'premium' && desktop,
      toggleTheme: app.toggleTheme,
      sideItems: side.map(([label, icon, r], i) => ({ k: label + (i === active ? '-on' : '-off') + s.theme, label, icon, bg: i === active ? t.navBg : 'transparent', fg: i === active ? t.navFg : t.muted, hover: i === active ? t.navFg : t.ink, go: () => this.nav(r) })),
      bottomItems: bottom.map(([label, icon, r, i]) => ({ k: label + (i === mobActive ? '-on' : '-off') + s.theme, label, icon, fg: i === mobActive ? t.ink : t.faint, bg: i === mobActive ? t.accentSoft : 'transparent', go: () => this.nav(r) })),
      goInicio: () => this.nav('inicio'), goMaestro: () => this.nav('maestro'), goSair: () => this.nav('landing'), goPlano: () => this.nav('plano'), goPerfil: () => this.nav('perfil'), goMentes: () => this.nav('mentes'),
      r: { inicio: route === 'inicio', chat: isChat, explorar: ['areas', 'area', 'mentes'].includes(route), conselho: route === 'conselho', clube: route === 'clube', conta: ['conversas', 'perfil', 'plano', 'memoria', 'estados'].includes(route) },
      routeKey: route + s.param + s.nonce, clubeMode: s.param === 'admin' ? 'admin' : 'leitor', notChat: !isChat,
      toast: s.toast, toastBottom: mobile && !isPublic && !isTriagem ? '104px' : '28px',
      showMap: !P.frameless, mapOpen: s.mapOpen, toggleMap: () => this.setState({ mapOpen: !s.mapOpen }), mapBottom: mobile && !isPublic && !isTriagem ? '100px' : '14px',
      mapItems: ROUTES.map(([k, label, path]) => { const [r, p] = k.split(':'); return { label, path, bg: r === route && (p || '') === (s.param || '') ? '#2A2A2E' : 'transparent', go: () => this.nav(r, p) }; }),
    };
  }
}
</script>
</body>
</html>
